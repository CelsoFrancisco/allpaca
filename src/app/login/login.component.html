<section class="login-page">

  <div class="login-building">

    <!-- =========================================
         TOPO DA CONSTRUÇÃO
         ========================================= -->
    <div class="building-top">

      <div class="building-leaf leaf-left"></div>

      <div class="building-title">
        <img
          src="assets/allpaca/allpaca-logo.png"
          alt="ALLpaca"
        >
      </div>

      <div class="building-leaf leaf-right"></div>

    </div>


    <!-- =========================================
         CORPO DA CONSTRUÇÃO
         ========================================= -->
    <div class="building-body">

      <!-- =========================================
           MASCOTE
           ========================================= -->
      <div class="login-mascote">

        <img
          src="assets/allpaca/moods/alpaca-surpresa.png"
          alt="Alpaca surpresa"
        >

      </div>


      <!-- =========================================
           PAINEL DO LOGIN
           ========================================= -->
      <div class="login-board">

        <!-- CABEÇALHO -->
        <div class="login-board-header">

          <h1>
            Entrar
          </h1>

          <p>
            Acesse sua conta ALLpaca
          </p>

        </div>


        <!-- =====================================
             E-MAIL
             ===================================== -->
        <div class="form-group">

          <label for="email">
            E-mail
          </label>

          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            required

            [class.campo-invalido]="
              formularioEnviado &&
              (
                !email.trim() ||
                !emailValido()
              )
            "

            [class.campo-valido]="
              emailValido()
            "
          >

        </div>


        <!-- =====================================
             SENHA
             ===================================== -->
        <div class="form-group">

          <label for="senha">
            Senha
          </label>

          <div class="senha-container">

            <input
              id="senha"

              [type]="
                mostrarSenha
                  ? 'text'
                  : 'password'
              "

              [(ngModel)]="senha"

              placeholder="Digite sua senha"

              autocomplete="current-password"

              minlength="8"

              required

              [class.campo-invalido]="
                formularioEnviado &&
                senha.length < 8
              "

              [class.campo-valido]="
                senha.length >= 8
              "
            >


            <!-- =================================
                 BOTÃO MOSTRAR / OCULTAR SENHA
                 ================================= -->
            <button
              type="button"
              class="senha-olho"

              (click)="alternarSenha()"

              [attr.aria-label]="
                mostrarSenha
                  ? 'Ocultar senha'
                  : 'Mostrar senha'
              "
            >

              <!-- OLHO FECHADO -->
              <svg
                *ngIf="!mostrarSenha"

                xmlns="http://www.w3.org/2000/svg"

                viewBox="0 0 24 24"

                aria-hidden="true"
              >

                <path
                  d="M2.1 12s3.5-6 9.9-6 9.9 6 9.9 6-3.5 6-9.9 6-9.9-6-9.9-6Z"

                  fill="none"

                  stroke="currentColor"

                  stroke-width="2"

                  stroke-linecap="round"

                  stroke-linejoin="round"
                />

                <circle
                  cx="12"
                  cy="12"
                  r="2.5"

                  fill="none"

                  stroke="currentColor"

                  stroke-width="2"
                />

              </svg>


              <!-- OLHO RISCADO -->
              <svg
                *ngIf="mostrarSenha"

                xmlns="http://www.w3.org/2000/svg"

                viewBox="0 0 24 24"

                aria-hidden="true"
              >

                <path
                  d="M3 3l18 18"

                  fill="none"

                  stroke="currentColor"

                  stroke-width="2"

                  stroke-linecap="round"
                />

                <path
                  d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 9.9 7 9.9 7a17.5 17.5 0 0 1-3.1 3.7"

                  fill="none"

                  stroke="currentColor"

                  stroke-width="2"

                  stroke-linecap="round"

                  stroke-linejoin="round"
                />

                <path
                  d="M6.2 6.2C3.8 7.9 2.1 12 2.1 12s3.5 6 9.9 6c1.6 0 3-.3 4.2-.8"

                  fill="none"

                  stroke="currentColor"

                  stroke-width="2"

                  stroke-linecap="round"

                  stroke-linejoin="round"
                />

              </svg>

            </button>

          </div>

        </div>


        <!-- =====================================
             MENSAGEM DE ERRO
             ===================================== -->
        <div
          *ngIf="mensagemErro"
          class="mensagem mensagem-erro"
        >

          <span class="mensagem-icone">
            !
          </span>

          <span>
            {{ mensagemErro }}
          </span>

        </div>


        <!-- =====================================
             BOTÃO LOGIN
             ===================================== -->
        <button
          type="button"
          class="login-button"

          (click)="login()"

          [disabled]="carregando"
        >

          <span *ngIf="!carregando">
            Entrar
          </span>

          <span *ngIf="carregando">
            Entrando...
          </span>

        </button>


        <!-- =====================================
             CADASTRO
             ===================================== -->
        <div class="cadastro-link">

          <span>
            Ainda não tem uma conta?
          </span>

          <button
            type="button"
            (click)="irParaCadastro()"
          >
            Criar conta
          </button>

        </div>

      </div>

    </div>


    <!-- =========================================
         PARTE INFERIOR DA CONSTRUÇÃO
         ========================================= -->
    <div class="building-bottom">

      <span></span>
      <span></span>
      <span></span>
      <span></span>

    </div>

  </div>

</section>
